name: church-platform-dev

services:
  postgres:
    image: postgres:18.6
    restart: "no"
    environment:
      # Public local-development defaults only; never use for staging/production.
      POSTGRES_DB: ${POSTGRES_DB:-church_platform_dev}
      POSTGRES_USER: ${POSTGRES_USER:-church_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
