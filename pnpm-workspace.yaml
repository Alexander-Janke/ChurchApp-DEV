packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Keep install artifacts local; these directories are already ignored by Git.
storeDir: .pnpm-store
cacheDir: .cache/pnpm
stateDir: .cache/pnpm-state

# Native compiler hooks for the Vitest transform and Drizzle Kit.
allowBuilds:
  "@swc/core": true
  esbuild: true
  # Packaged native bindings suffice; do not run the fallback installer.
  unrs-resolver: false
